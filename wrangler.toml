name = "reodeep-chat"
main = "worker.js"
compatibility_date = "2026-11-22"

# 静态资源托管，打包后的chat-demo前端dist目录
[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_id = "aac4f241-97e3-4e1b-99ba-f33151f68b4f"

# 自定义域名 reodeep.de5.net
[custom_domain]
domain = "reodeep.de5.net"

# 环境变量，DEEPSEEK_API_KEY 在CF控制台填写，不要硬写在这里
[vars]
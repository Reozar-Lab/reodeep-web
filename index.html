<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>reodeep</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --line: #2c313a;
    --text: #f2f4f7;
    --sub: #9aa3b2;
    --brand: #4f8cff;
    --user: #2b3a55;
    --bot: #1e222a;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 820px; height: 100vh; display: flex; flex-direction: column; }

  /* ---------- 登录 / 注册 ---------- */
  .auth {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .auth-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 32px; width: 100%; max-width: 360px;
  }
  .auth-card h1 { font-size: 22px; margin-bottom: 6px; }
  .auth-card p { color: var(--sub); font-size: 13px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; color: var(--sub); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 11px 12px; background: #11141a; border: 1px solid var(--line);
    border-radius: 10px; color: var(--text); font-size: 15px; outline: none;
  }
  input:focus { border-color: var(--brand); }
  .btn {
    width: 100%; margin-top: 22px; padding: 12px; border: none; border-radius: 10px;
    background: var(--brand); color: #fff; font-size: 15px; cursor: pointer;
  }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--sub); margin-top: 10px; }
  .err { color: var(--err); font-size: 13px; margin-top: 14px; min-height: 18px; }
  .switch { text-align: center; margin-top: 16px; font-size: 13px; color: var(--sub); }
  .switch a { color: var(--brand); cursor: pointer; }

  /* ---------- 聊天页 ---------- */
  .chat-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--line);
  }
  .chat-header .title { font-weight: 600; }
  .chat-header button {
    background: transparent; border: 1px solid var(--line); color: var(--sub);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  .messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 80%; padding: 12px 14px; border-radius: 12px; line-height: 1.6; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.bot { align-self: flex-start; background: var(--bot); }
  .msg.bot .meta { font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  .typing { color: var(--sub); font-style: italic; }
  .composer { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); }
  .composer textarea {
    flex: 1; background: #11141a; border: 1px solid var(--line); border-radius: 12px;
    color: var(--text); padding: 12px; font-size: 15px; resize: none; outline: none; height: 52px;
  }
  .composer textarea:focus { border-color: var(--brand); }
  .composer .send {
    width: 52px; border: none; border-radius: 12px; background: var(--brand); color: #fff;
    font-size: 18px; cursor: pointer;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <!-- 登录 -->
  <section id="auth" class="auth">
    <div class="auth-card">
      <h1>reodeep</h1>
      <p id="authSub">登录后开始对话</p>
      <label>用户名</label>
      <input id="username" autocomplete="username" placeholder="输入用户名">
      <label>密码</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="输入密码">
      <div class="err" id="authErr"></div>
      <button class="btn" id="authBtn">登录</button>
      <div class="switch" id="authSwitch">还没有账号？<a id="toRegister">去注册</a></div>
    </div>
  </section>

  <!-- 聊天 -->
  <section id="chat" class="hidden" style="flex:1; display:flex; flex-direction:column;">
    <header class="chat-header">
      <div class="title">reodeep</div>
      <button id="logoutBtn">退出登录</button>
    </header>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <textarea id="input" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="sendBtn">➤</button>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
let mode = 'login';           // login | register
let messages = [];            // 本地消息链（D1 持久化后面再接）
let sending = false;

const authViews = {
  login:    { sub: '登录后开始对话', btn: '登录', switch: '还没有账号？', link: '去注册', linkMode: 'register' },
  register: { sub: '注册一个账号（过渡版，无验证）', btn: '注册', switch: '已有账号？', link: '去登录', linkMode: 'login' }
};

function setMode(m) {
  mode = m;
  $('authSub').textContent = authViews[m].sub;
  $('authBtn').textContent = authViews[m].btn;
  $('authSwitch').innerHTML = `${authViews[m].switch} <a id="toSwitch">${authViews[m].link}</a>`;
  $('toSwitch').onclick = () => setMode(authViews[m].linkMode);
  $('authErr').textContent = '';
}

$('toRegister').onclick = () => setMode('register');

async function authRequest() {
  const username = $('username').value.trim();
  const password = $('password').value;
  if (!username || !password) { $('authErr').textContent = '账号密码不能为空'; return; }
  $('authErr').textContent = '';
  try {
    const res = await fetch(mode === 'login' ? '/api/auth/login' : '/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) { $('authErr').textContent = data.err || '请求失败'; return; }
    enterChat();
  } catch (e) {
    $('authErr').textContent = '网络错误：' + e.message;
  }
}

$('authBtn').onclick = authRequest;
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') authRequest(); });

function enterChat() {
  $('auth').classList.add('hidden');
  $('chat').classList.remove('hidden');
}

$('logoutBtn').onclick = async () => {
  await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' });
  location.reload();
};

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
  return div;
}

async function send() {
  if (sending) return;
  const text = $('input').value.trim();
  if (!text) return;
  $('input').value = '';
  sending = true;

  messages.push({ role: 'user', content: text });
  addMsg('user', text);
  const botDiv = addMsg('bot', '');
  botDiv.querySelector ? null : (botDiv.textContent = '');

  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ messages, stream: true })
    });

    if (res.status === 401) { location.reload(); return; }
    if (!res.ok || !res.body) {
      botDiv.textContent = '请求失败（HTTP ' + res.status + '）';
      sending = false; return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let full = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (raw === '[DONE]') continue;
        try {
          const j = JSON.parse(raw);
          const delta = j.choices?.[0]?.delta?.content || '';
          if (delta) {
            full += delta;
            botDiv.textContent = full;
            $('messages').scrollTop = $('messages').scrollHeight;
          }
        } catch (_) {}
      }
    }
    messages.push({ role: 'assistant', content: full });
  } catch (e) {
    botDiv.textContent = '网络错误：' + e.message;
  }
  sending = false;
}

$('sendBtn').onclick = send;
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// 页面刷新后，用 Cookie 探测是否已登录
// 依赖 Worker 提供 GET /api/auth/me，未登录返回 401
(async () => {
  try {
    const res = await fetch('/api/auth/me', { credentials: 'same-origin' });
    if (res.ok) enterChat(); else setMode('login');
  } catch { setMode('login'); }
})();
</script>
</body>
</html>
